[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhc-parser"
version = "0.1.0"
description = "Typed AST parsers for all four NHC tropical cyclone advisory products"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["nhc", "hurricane", "tropical-cyclone", "advisory", "parser", "ast"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nhc_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["nhc_parser"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
