[workspace]
members = [
    "crates/nhc-types",
    "crates/nhc-parser",
    "crates/nhc-ingest",
    "crates/nhc-download",
    "crates/nhc-validate",
]
resolver = "2"

[workspace.dependencies]
# Parsing
pest       = "2.7"
pest_derive = "2.7"

# Async runtime
tokio      = { version = "1", features = ["full"] }

# HTTP client
reqwest    = { version = "0.12", features = ["gzip"] }

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror  = "2"
anyhow     = "1"

# Config
config = "0.15"

# CLI
clap = { version = "4", features = ["derive"] }

# Regex
regex = "1"

# Directory traversal
walkdir = "2"
